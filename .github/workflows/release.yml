name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_flag: '--mac --arm64'
            artifact_name: 'build-macos-arm64'
          - os: macos-latest
            platform_flag: '--mac --x64'
            artifact_name: 'build-macos-x64'
          - os: windows-latest
            platform_flag: '-w'
            artifact_name: 'build-windows'
          - os: ubuntu-latest
            platform_flag: '-l'
            artifact_name: 'build-ubuntu'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package application
        run: npx electron-builder build --publish never ${{ matrix.platform_flag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.exe
            release/build/*.AppImage
            release/build/*.deb
            release/build/*.yml

  create-release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/*
