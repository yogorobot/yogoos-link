name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'testing-v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - stable
      version:
        description: 'Version name, for example 1.2.3-testing.1'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
            if [ "$CHANNEL" = "testing" ]; then
              TAG="testing-v${VERSION#v}"
              PRERELEASE="true"
              NAME="Testing ${TAG}"
            else
              TAG="v${VERSION#v}"
              PRERELEASE="false"
              NAME="Release ${TAG}"
            fi
          else
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"testing"* ]]; then
              PRERELEASE="true"
              NAME="Testing ${TAG}"
            else
              PRERELEASE="false"
              NAME="Release ${TAG}"
            fi
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  build:
    needs:
      - prepare
      - create-release
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_flag: '--mac --arm64'
          - os: macos-latest
            platform_flag: '--mac --x64'
          - os: windows-latest
            platform_flag: '-w'
          - os: ubuntu-latest
            platform_flag: '-l'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package application
        run: npx electron-builder build --publish never ${{ matrix.platform_flag }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.exe
            release/build/*.AppImage
            release/build/*.deb
            release/build/*.yml
