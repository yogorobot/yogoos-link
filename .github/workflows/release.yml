name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - stable
      version:
        description: 'Version name, for example 1.2.3-testing.1'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
            if [ "$CHANNEL" = "testing" ]; then
              TAG="v${VERSION#v}"
              PRERELEASE="true"
              NAME="Testing ${TAG}"
            else
              TAG="v${VERSION#v}"
              PRERELEASE="false"
              NAME="Release ${TAG}"
            fi
          else
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"testing"* ]]; then
              PRERELEASE="true"
              NAME="Testing ${TAG}"
            else
              PRERELEASE="false"
              NAME="Release ${TAG}"
            fi
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Release Notes
        id: changelog
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          VERSION="${TAG#v}"

          # 从 CHANGELOG.md 提取当前版本的变更内容
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            $0 ~ "^## \\[" { if (flag) exit }
            flag { print }
          ' CHANGELOG.md)

          # 去除首尾空行
          NOTES="$(echo "$NOTES" | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"

          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  build:
    needs:
      - prepare
      - create-release
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_flag: '--mac --arm64 --x64'
            artifact_name: macos
          - os: windows-latest
            platform_flag: '-w'
            artifact_name: windows
          - os: ubuntu-latest
            platform_flag: '-l'
            artifact_name: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: npx electron-builder build --publish never ${{ matrix.platform_flag }}

      - name: Package application
        if: runner.os != 'macOS'
        run: npx electron-builder build --publish never ${{ matrix.platform_flag }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.exe
            release/build/*.AppImage
            release/build/*.deb
            release/build/latest.yml
            release/build/latest-mac.yml
            release/build/latest-linux.yml
            release/build/*.blockmap
          if-no-files-found: ignore

  publish-release-assets:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/latest.yml
            release-artifacts/**/latest-mac.yml
            release-artifacts/**/latest-linux.yml
            release-artifacts/**/*.blockmap
