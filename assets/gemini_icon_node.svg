<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <title>SSH Inspect Icon - Connected Node</title>
  
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#1a2a3a; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a; stop-opacity:1" />
    </radialGradient>
    
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="activeConnection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="22" ry="22" fill="url(#backgroundGradient)" />
  
  <g filter="url(#nodeGlow)">
    <!-- Connection Lines -->
    <g stroke="#4f46e5" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="50" x2="25" y2="25" />
      <line x1="50" y1="50" x2="80" y2="40" />
    </g>
    
    <!-- Active Connection Line -->
    <line x1="50" y1="50" x2="45" y2="80" stroke="url(#activeConnection)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Nodes -->
    <g fill="#c7d2fe">
      <!-- Peripheral Nodes -->
      <circle cx="25" cy="25" r="8" />
      <circle cx="80" cy="40" r="8" />
      <circle cx="45" cy="80" r="8" />
    </g>
    
    <!-- Central Node -->
    <circle cx="50" cy="50" r="12" fill="#f1f5f9" />
  </g>
</svg>
