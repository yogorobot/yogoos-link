<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>yolink shield icon</title>
  <desc>Shield with YOLINK wordmark indicating secure connection</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="360" y1="320" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Soft glow behind shield -->
  <ellipse cx="512" cy="480" rx="320" ry="240" fill="url(#glow)"/>
  <!-- Shield -->
  <path d="M512 240 C 600 300, 704 320, 784 336 C 784 592, 676 720, 512 784 C 348 720, 240 592, 240 336 C 320 320, 424 300, 512 240 Z" fill="url(#shieldGrad)" stroke="#E0E7FF" stroke-opacity="0.5" stroke-width="8"/>
  <!-- YOLINK wordmark (centered) -->
  <text x="512" y="580" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800"
    fill="#FFFFFF" letter-spacing="6">YOLINK</text>
</svg>
